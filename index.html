<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#14100e">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="mobile-web-app-capable" content="yes">
<title>使命 · 复刻版</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%2314100e'/%3E%3Cpath d='M32 10l4 14 14 4-14 4-4 14-4-14-14-4 14-4z' fill='%23ffd166'/%3E%3C/svg%3E">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div id="app">
  <canvas id="game"></canvas>

  <!-- 顶部 HUD -->
  <div id="hud">
    <div class="hud-left">
      <div class="lv-badge" id="lvText">Lv.1</div>
      <div class="bars">
        <div class="bar hp"><i id="hpFill"></i><span id="hpText">150 / 150</span></div>
        <div class="bar qi"><i id="qiFill"></i><span id="qiText">70 / 70</span></div>
        <div class="bar xp"><i id="xpFill"></i></div>
      </div>
    </div>
    <div class="hud-mid">
      <div id="questBox" class="quest-box"></div>
    </div>
    <div id="bossBar" class="boss-bar">
      <div id="bossName" class="boss-name"></div>
      <div class="boss-track"><i id="bossFill"></i></div>
    </div>
    <div class="hud-right">
      <div class="coins"><span class="coin-icon">金</span><b id="coinText">0</b></div>
      <button class="top-btn" id="btnBag">囊</button>
      <button class="top-btn" id="btnChar">人</button>
      <button class="top-btn" id="btnQuest">卷</button>
      <button class="top-btn" id="btnMenu">≡</button>
    </div>
    <div id="notices"></div>
    <div id="hint" class="hint"></div>
  </div>

  <!-- 触控按钮 -->
  <div id="controls">
    <button id="btnAction" class="act-btn">交谈</button>
    <div class="pad">
      <button id="btnHp" class="pot hp">红</button>
      <button id="btnMp" class="pot mp">蓝</button>
      <div class="skills">
        <button id="sk0" class="sk"><span class="sk-name">空</span><i class="cd"></i><em class="key">1</em></button>
        <button id="sk1" class="sk"><span class="sk-name">空</span><i class="cd"></i><em class="key">2</em></button>
        <button id="sk2" class="sk"><span class="sk-name">空</span><i class="cd"></i><em class="key">3</em></button>
        <button id="sk3" class="sk"><span class="sk-name">空</span><i class="cd"></i><em class="key">4</em></button>
      </div>
      <button id="btnAtk" class="atk">攻击</button>
    </div>
  </div>

  <!-- 对话 -->
  <div id="dialog"></div>
  <!-- 面板 -->
  <div id="panel"></div>
  <!-- 弹窗 -->
  <div id="modal"></div>
  <!-- 标题 -->
  <div id="title"></div>
  <div id="deathFade"></div>
</div>
<script src="js/data.js"></script>
<script src="js/core.js"></script>
<script src="js/world.js"></script>
<script src="js/combat.js"></script>
<script src="js/render.js"></script>
<script src="js/ui.js"></script>
<script src="js/main.js"></script>
</body>
</html>
